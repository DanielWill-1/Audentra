<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Audentra{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'js/shell.js' %}" defer></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="min-h-screen bg-background font-body text-on-surface antialiased" data-active-route="{{ active_route|default:'' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% block body %}{% endblock %}
  </body>
</html>
