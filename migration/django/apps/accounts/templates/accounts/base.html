<!doctype html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"historyCacheSize":0,"allowEval":false,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
  <script src="{% static 'vendor/htmx-2.0.8.min.js' %}" defer></script>
  <script src="{% static 'js/p7_auth_forms.js' %}" defer></script>
  <title>{% block title %}Audentra{% endblock %}</title>
  <style>
    body{font:16px/1.5 system-ui,sans-serif;background:#f4f6fb;color:#172033;margin:0;padding:3rem 1rem}
    main{max-width:34rem;margin:auto;background:#fff;padding:2rem;border-radius:1rem;box-shadow:0 12px 40px #17203312}
    h1{font-size:1.7rem;margin-top:0}label{display:block;margin:.9rem 0 .25rem;font-weight:600}
    input{box-sizing:border-box;width:100%;padding:.7rem;border:1px solid #aeb7c7;border-radius:.4rem;font:inherit}
    input[type=checkbox]{width:auto}button,.button{display:inline-block;margin-top:1rem;padding:.7rem 1rem;border:0;border-radius:.4rem;background:#3449ce;color:#fff;font:inherit;text-decoration:none;cursor:pointer}
    .error{color:#9c2020;background:#fff0f0;padding:.65rem;border-radius:.35rem}.help{color:#526077}
    ul.errorlist{color:#9c2020;padding-left:1.2rem}a{color:#3449ce}nav{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.2rem}.auth-home{display:inline-block;margin-bottom:1rem;font-weight:700}.password-toggle{margin-top:.25rem;padding:.25rem .5rem;font-size:.85rem}.terms-consent{display:flex;align-items:flex-start;gap:.5rem;font-size:.9rem}.terms-consent input{width:auto;margin-top:.35rem}
    *{box-sizing:border-box}body{font-family:"Hanken Grotesk",system-ui,sans-serif;color:#111827}input[type=checkbox]{width:1rem;height:1rem}
    .auth-login-page{min-height:100vh;display:grid;place-items:center;padding:2.5rem 1rem}.auth-login-page #auth-main{width:min(100%,25rem);padding:0;background:transparent;border:0;border-radius:0;box-shadow:none}
    .auth-login-page #auth-main>.auth-home{display:none}
    .login-shell h1{text-align:center;font-size:2rem;line-height:1.2;letter-spacing:-.035em;margin:0 0 .55rem}.login-shell .login-subtitle{text-align:center;color:#526077;margin:0 0 2rem}
    .login-brand{display:flex;justify-content:center;align-items:center;gap:.55rem;color:#111827;text-decoration:none;font-size:1.45rem;font-weight:650;letter-spacing:-.03em;margin:0 0 2.35rem}.brand-mark{height:1.05rem;display:inline-flex;align-items:center;gap:2px}.brand-mark i{width:2.5px;border-radius:3px;background:#2563eb}.brand-mark i:nth-child(1){height:.48rem}.brand-mark i:nth-child(2){height:.76rem;background:#7c3aed}.brand-mark i:nth-child(3){height:1rem}.brand-mark i:nth-child(4){height:.7rem;background:#7c3aed}.brand-mark i:nth-child(5){height:.4rem}
    .login-panel{background:#fff;border:1px solid #e0e4ec;border-radius:.8rem;padding:1.5rem;box-shadow:0 2px 4px #17203305}.login-error{margin:0 0 1rem;color:#9c2020;background:#fff0f0;padding:.65rem .8rem;border-radius:.5rem}.google-button{width:100%;height:2.5rem;display:flex;justify-content:center;align-items:center;gap:.55rem;border:1px solid #dfe3ea;border-radius:.55rem;background:#fff;color:#111827;margin:0;padding:.4rem 1rem}.google-mark{display:block;width:1rem;height:1rem;flex:none;color:#4285f4}.provider-note{font-size:.72rem;line-height:1.35;text-align:center;color:#6b7280;margin:.4rem 0 0}
    .login-divider{display:flex;align-items:center;gap:.7rem;color:#687386;font:.7rem/1.4 ui-monospace,monospace;text-align:center;margin:1.15rem 0}.login-divider:before,.login-divider:after{content:"";height:1px;background:#e2e5eb;flex:1}
    .login-field{margin:0 0 1rem}.login-field>label,.login-password-row label{display:block;margin:0 0 .4rem;font-weight:550;font-size:.9rem}.login-password-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}.login-password-row label{margin:0}.login-password-row a{font-size:.78rem;text-decoration:none}.login-field input:not([type=checkbox]){height:2.5rem;padding:.5rem .75rem;border-radius:.55rem}.login-password-control{position:relative}.login-password-control input{padding-right:2.6rem!important}.login-password-control .password-toggle{position:absolute;right:.1rem;top:50%;transform:translateY(-50%);width:2.35rem;height:2.25rem;margin:0;padding:0;font-size:0;background:transparent;color:#687386}.login-password-control .password-toggle:after{content:"◉";font-size:.95rem}.login-remember{display:flex;align-items:center;gap:.5rem;margin:.1rem 0 .9rem;font-size:.82rem;color:#526077;font-weight:400}.login-remember input{margin:0;accent-color:#2563eb}.login-submit{width:100%;height:2.5rem;margin:0;border-radius:.55rem;background:#2563eb;font-weight:600}.login-footer{text-align:center;color:#526077;font-size:.9rem;margin:1.35rem 0 0}.login-github{text-align:center;margin:2rem 0 0;font-size:.78rem}.login-github a{color:#687386;text-decoration:none}.login-github a:hover{color:#111827}
    .auth-signup-page,.auth-message-page{min-height:100vh;display:grid;place-items:center;padding:2.5rem 1rem}
    .auth-signup-page #auth-main{width:min(100%,25rem);padding:0;background:transparent;border:0;border-radius:0;box-shadow:none}
    .auth-message-page #auth-main{width:min(100%,28rem);padding:0;background:transparent;border:0;border-radius:0;box-shadow:none}
    .auth-signup-page #auth-main>.auth-home,.auth-message-page #auth-main>.auth-home{display:none}
    .signup-name-fields{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
    .signup-name-fields .login-field,.signup-name-fields input{min-width:0}
    .signup-password-control{position:relative}
    .signup-password-control input{padding-right:2.7rem!important}
    .signup-password-control .password-toggle{position:absolute;right:.1rem;top:50%;transform:translateY(-50%);height:2.25rem;margin:0;padding:0 .35rem;font-size:.7rem;background:transparent;color:#687386}
    .signup-submit{width:100%;height:2.5rem;margin:0;border-radius:.55rem;background:#2563eb;font-weight:600}
    .signup-footer{margin:1.35rem 0 0;text-align:center;color:#526077;font-size:.9rem}
    .message-shell .login-brand{margin-bottom:1.75rem}
    .message-shell h1{text-align:center;font-size:2rem;line-height:1.2;letter-spacing:-.035em;margin:0 0 .75rem}
    .message-panel{background:#fff;border:1px solid #e0e4ec;border-radius:.8rem;padding:1.5rem;box-shadow:0 2px 4px #17203305;text-align:center}
    .message-panel p{color:#526077;margin:.5rem 0 0}
    .message-panel nav{justify-content:center;margin-top:1.25rem}
    @media(max-width:480px){.auth-login-page{padding:1.5rem 1rem}.login-brand{margin-bottom:1.8rem}.login-shell .login-subtitle{margin-bottom:1.5rem}.login-panel{padding:1.25rem}}
    @media(max-width:480px){.auth-signup-page,.auth-message-page{padding:1.5rem 1rem}.signup-shell .login-brand{margin-bottom:1.5rem}.signup-shell .login-subtitle{margin-bottom:1.1rem}.message-shell .login-brand{margin-bottom:1.25rem}.message-panel{padding:1.25rem}}
  </style>
</head>
<body class="auth-page {% block body_class %}{% endblock %}" hx-boost="true" hx-target="#auth-main" hx-select="#auth-main" hx-swap="outerHTML" hx-history="false"><main id="auth-main"><a class="auth-home" href="/" aria-label="Audentra home">Audentra</a>{% block content %}{% endblock %}</main></body>
</html>
