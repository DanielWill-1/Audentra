[project]
name = "voiceform-django-foundation"
version = "0.1.0"
description = "Parallel Django foundation for the VoiceForm migration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.18",
  "google-cloud-speech>=2.41,<3",
  "google-cloud-texttospeech>=2,<3",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "supabase>=2.28,<3",
  "waitress==3.0.2",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "django-stubs[compatible-mypy]>=5.2,<6",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-django>=4.10,<5",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["config", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unused_ignores = true
exclude = ["migrations/", ".venv/"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"
